<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>เกมงู | SNAKE RETRO</title>
  <style>
    /* ===== RETRO STYLE (Nokia-like green phosphor) ===== */
    :root {
      --bg: #000000;
      --green: #33ff33;
      --dark-green: #0a1a0a;
      --border: #114411;
      --accent: #00cc00;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 12px 8px;
      background: #0a0a0a;
      color: var(--green);
      font-family: 'Courier New', 'Lucida Console', monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      touch-action: manipulation;
    }
    .header {
      text-align: center;
      margin-bottom: 8px;
    }
    .title {
      font-size: 28px;
      letter-spacing: 4px;
      text-shadow: 0 0 8px var(--green);
      margin: 0;
      font-weight: bold;
    }
    .subtitle {
      font-size: 11px;
      opacity: 0.7;
      letter-spacing: 2px;
      margin-top: 2px;
    }
    .status-bar {
      display: flex;
      justify-content: space-between;
      width: min(440px, 94vmin);
      background: #001100;
      border: 4px solid var(--border);
      padding: 5px 12px;
      margin-bottom: 6px;
      font-size: 13px;
      font-weight: bold;
      text-shadow: 0 0 4px var(--green);
    }
    .status-item {
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .label { opacity: 0.75; font-size: 10px; }
    .value { color: #66ff66; min-width: 28px; text-align: right; font-size: 14px; }

    .game-wrapper {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    canvas {
      width: min(400px, 92vmin);
      height: min(400px, 92vmin);
      image-rendering: pixelated;
      border: 8px solid #114411;
      background: #000;
      box-shadow: 0 0 0 4px #001100,
                  0 8px 0 #001100;
      touch-action: none;
      cursor: crosshair;
    }

    .instructions {
      margin-top: 10px;
      font-size: 10px;
      opacity: 0.65;
      text-align: center;
      line-height: 1.5;
    }
    .instructions kbd {
      background: #001100;
      border: 1px solid #114411;
      padding: 1px 5px;
      font-size: 9px;
    }

    @media (max-width: 380px) {
      .title { font-size: 22px; }
      .status-bar { font-size: 12px; padding: 4px 8px; }
    }
  </style>
</head>
<body>
  <div class="header">
    <h1 class="title">SNAKE</h1>
    <div class="subtitle">RETRO 1980s • KEYBOARD + TOUCH</div>
  </div>

  <!-- Score & Level & Warp Timer -->
  <div class="status-bar">
    <div class="status-item">
      <span class="label">SCORE</span>
      <span id="score" class="value">000</span>
    </div>
    <div class="status-item">
      <span class="label">LEVEL</span>
      <span id="level" class="value">01</span>
    </div>
    <div class="status-item">
      <span class="label">WARP</span>
      <span id="warpTimer" class="value" style="color:#66ffff;">10s</span>
    </div>
  </div>

  <div class="game-wrapper">
    <!-- Game Canvas (20x20 grid) -->
    <canvas id="game" width="400" height="400" aria-label="Snake game board"></canvas>
  </div>

  <div class="instructions">
    KEYBOARD: <kbd>↑</kbd><kbd>↓</kbd><kbd>←</kbd><kbd>→</kbd>/WASD &nbsp;|&nbsp; TOUCH: Swipe/Tap canvas &nbsp;|&nbsp; SPACE/P: PAUSE &nbsp;|&nbsp; R: RESTART
  </div>

  <script>
    // ===== CONFIG =====
    const GRID = 20;           // 20x20 ช่อง
    const CELL = 20;           // 400x400 px
    const INITIAL_SPEED = 155;
    const MIN_SPEED = 52;

    // ===== FIXED WALLS (permanent, snake cannot pass) =====
    const WALLS = [
      // corner obstacles (NW, NE, SW, SE)
      {x:2,y:2},{x:3,y:2},{x:2,y:3},
      {x:16,y:2},{x:17,y:2},{x:17,y:3},
      {x:2,y:16},{x:2,y:17},{x:3,y:17},
      {x:17,y:16},{x:17,y:17},{x:16,y:17},
      // center barriers (gaps for navigation)
      {x:7,y:7},{x:8,y:7},
      {x:11,y:12},{x:12,y:12},
      // side pillars
      {x:4,y:14},{x:15,y:5}
    ];

    // ===== STATE =====
    let snake = [];
    let dir = { x: 1, y: 0 };
    let pendingDir = { x: 1, y: 0 };
    let food = { x: 0, y: 0 };
    let warpA = null;
    let warpB = null;
    let score = 0;
    let level = 1;
    let foodsEaten = 0;
    let moveInterval = INITIAL_SPEED;
    let lastMoveTime = 0;
    let paused = false;
    let gameOver = false;
    let gameStarted = false;

    // Touch tracking for swipe + tap
    let touchStartX = 0;
    let touchStartY = 0;
    let touchStartTime = 0;
    let touchMoved = false;
    const SWIPE_THRESHOLD = 28;

    // Warp timer (relocate every 10s)
    let warpNextTime = 0;
    let pausedWarpRemaining = 10000;

    // Canvas
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d', { alpha: false });

    // UI
    const scoreEl = document.getElementById('score');
    const levelEl = document.getElementById('level');
    const warpEl = document.getElementById('warpTimer');

    // ===== AUDIO =====
    let audioCtx;
    function playBeep(freq, duration, type = 'square', vol = 0.08) {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        const filter = audioCtx.createBiquadFilter();
        osc.type = type;
        osc.frequency.value = freq;
        filter.type = 'lowpass';
        filter.frequency.value = 1100;
        gain.gain.value = vol;
        const now = audioCtx.currentTime;
        osc.connect(filter);
        filter.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        gain.gain.linearRampToValueAtTime(0.0001, now + duration);
        osc.stop(now + duration + 0.04);
      } catch (e) {}
    }

    // ===== HELPERS =====
    function isWall(x, y) {
      return WALLS.some(w => w.x === x && w.y === y);
    }

    function findRandomEmptyCell(avoid = []) {
      const occ = new Set();
      snake.forEach(s => occ.add(s.x + ',' + s.y));
      WALLS.forEach(w => occ.add(w.x + ',' + w.y));
      if (food && typeof food.x === 'number') occ.add(food.x + ',' + food.y);
      if (warpA) occ.add(warpA.x + ',' + warpA.y);
      if (warpB) occ.add(warpB.x + ',' + warpB.y);
      avoid.forEach(a => occ.add(a.x + ',' + a.y));

      const free = [];
      for (let x = 0; x < GRID; x++) {
        for (let y = 0; y < GRID; y++) {
          if (!occ.has(x + ',' + y)) free.push({x, y});
        }
      }
      if (free.length === 0) {
        // fallback (very rare)
        for (let x = 0; x < GRID; x++) {
          for (let y = 0; y < GRID; y++) {
            if (!isWall(x, y) && !snake.some(s => s.x === x && s.y === y)) return {x, y};
          }
        }
        return {x: 0, y: 0};
      }
      return free[Math.floor(Math.random() * free.length)];
    }

    function spawnFood() {
      let newFood;
      let attempts = 0;
      do {
        newFood = { x: Math.floor(Math.random() * GRID), y: Math.floor(Math.random() * GRID) };
        attempts++;
      } while (
        attempts < 120 &&
        (snake.some(seg => seg.x === newFood.x && seg.y === newFood.y) ||
         isWall(newFood.x, newFood.y) ||
         (warpA && newFood.x === warpA.x && newFood.y === warpA.y) ||
         (warpB && newFood.x === warpB.x && newFood.y === warpB.y))
      );
      food = newFood;
    }

    function spawnWarp() {
      warpA = findRandomEmptyCell();
      warpB = findRandomEmptyCell();
      if (warpA.x === warpB.x && warpA.y === warpB.y) {
        warpB = findRandomEmptyCell([warpA]);
      }
    }

    function relocateWarp() {
      if (!gameStarted || gameOver) return;
      warpA = findRandomEmptyCell();
      warpB = findRandomEmptyCell();
      if (warpA.x === warpB.x && warpA.y === warpB.y) {
        warpB = findRandomEmptyCell([warpA]);
      }
      // move food if landed on gate
      if (food &&
          ((food.x === warpA.x && food.y === warpA.y) ||
           (food.x === warpB.x && food.y === warpB.y))) {
        spawnFood();
      }
      warpNextTime = performance.now() + 10000;
      pausedWarpRemaining = 10000;
      playBeep(620, 0.035, 'square', 0.06);
    }

    function updateWarpUI() {
      if (!warpEl) return;
      let secs = 10;
      if (gameStarted && warpNextTime > 0) {
        const now = performance.now();
        if (paused && pausedWarpRemaining > 0) {
          secs = Math.max(1, Math.ceil(pausedWarpRemaining / 1000));
        } else {
          const rem = Math.max(0, warpNextTime - now);
          secs = Math.max(1, Math.ceil(rem / 1000));
        }
      }
      warpEl.textContent = secs + 's';
    }

    // ===== RESET =====
    function resetGame() {
      snake = [
        { x: 6, y: 10 },
        { x: 5, y: 10 },
        { x: 4, y: 10 }
      ];
      dir = { x: 1, y: 0 };
      pendingDir = { x: 1, y: 0 };
      score = 0;
      level = 1;
      foodsEaten = 0;
      moveInterval = INITIAL_SPEED;
      paused = false;
      gameOver = false;
      gameStarted = false;
      lastMoveTime = 0;

      warpA = null;
      warpB = null;
      spawnWarp();
      warpNextTime = performance.now() + 10000;
      pausedWarpRemaining = 10000;

      spawnFood();
      updateUI();
      updateWarpUI();
      draw();
    }

    // ===== UI =====
    function updateUI() {
      scoreEl.textContent = String(score).padStart(3, '0');
      levelEl.textContent = String(level).padStart(2, '0');
    }

    function increaseSpeed() {
      level = Math.min(13, 1 + Math.floor(foodsEaten / 4));
      moveInterval = Math.max(MIN_SPEED, Math.floor(INITIAL_SPEED - (level - 1) * 8.5));
    }

    // ===== DIRECTION =====
    function changeDirection(newDir) {
      if (gameOver) return;

      if (!gameStarted) {
        gameStarted = true;
        lastMoveTime = performance.now();
        warpNextTime = performance.now() + 10000; // start warp timer on first move
      }

      if (newDir.x === -dir.x && newDir.y === -dir.y) return;
      pendingDir = newDir;
    }

    // ===== UPDATE LOGIC =====
    function update() {
      if (paused || gameOver || !gameStarted) return;

      dir = pendingDir;

      const head = {
        x: snake[0].x + dir.x,
        y: snake[0].y + dir.y
      };

      // 1. bounds
      if (head.x < 0 || head.x >= GRID || head.y < 0 || head.y >= GRID) {
        endGame();
        return;
      }

      // 2. wall
      if (isWall(head.x, head.y)) {
        endGame();
        return;
      }

      // 3. warp gate teleport?
      let finalHead = { x: head.x, y: head.y };
      if (warpA && head.x === warpA.x && head.y === warpA.y) {
        finalHead = { x: warpB.x, y: warpB.y };
        playBeep(840, 0.045, 'sine', 0.065);
      } else if (warpB && head.x === warpB.x && head.y === warpB.y) {
        finalHead = { x: warpA.x, y: warpA.y };
        playBeep(840, 0.045, 'sine', 0.065);
      }

      // 4. self collision (after possible teleport)
      const tailIndex = snake.length - 1;
      const collides = snake.some((seg, idx) =>
        idx !== tailIndex && seg.x === finalHead.x && seg.y === finalHead.y
      );
      if (collides) {
        endGame();
        return;
      }

      snake.unshift(finalHead);

      // eat?
      let ate = false;
      if (finalHead.x === food.x && finalHead.y === food.y) {
        score += 10;
        foodsEaten++;
        increaseSpeed();
        playBeep(920, 0.08, 'square', 0.09);
        spawnFood();
        ate = true;
        updateUI();
      }

      if (!ate) {
        snake.pop();
      }
    }

    // ===== DRAW =====
    function draw() {
      // background
      ctx.fillStyle = '#000000';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // subtle grid
      ctx.strokeStyle = '#0a220a';
      ctx.lineWidth = 1;
      for (let i = 0; i <= GRID; i++) {
        ctx.beginPath();
        ctx.moveTo(i * CELL, 0);
        ctx.lineTo(i * CELL, canvas.height);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(0, i * CELL);
        ctx.lineTo(canvas.width, i * CELL);
        ctx.stroke();
      }

      // WALLS (retro dark green blocks)
      WALLS.forEach(w => {
        const x = w.x * CELL;
        const y = w.y * CELL;
        ctx.fillStyle = '#1a331a';
        ctx.fillRect(x + 1, y + 1, CELL - 2, CELL - 2);
        ctx.fillStyle = '#0d220d';
        ctx.fillRect(x + 3, y + 3, CELL - 6, CELL - 6);
        ctx.strokeStyle = '#335533';
        ctx.lineWidth = 1;
        ctx.strokeRect(x + 2, y + 2, CELL - 4, CELL - 4);
      });

      // WARP GATES (cyan portals, blink)
      if (warpA && warpB) {
        const blink = Math.floor(performance.now() / 110) % 7 < 4;
        [warpA, warpB].forEach(gate => {
          const px = gate.x * CELL;
          const py = gate.y * CELL;
          // bright frame
          ctx.fillStyle = blink ? '#55ffff' : '#008888';
          ctx.fillRect(px + 2, py + 2, CELL - 4, CELL - 4);
          // dark core
          ctx.fillStyle = '#001f1f';
          ctx.fillRect(px + 5, py + 5, CELL - 10, CELL - 10);
          // center highlight
          ctx.fillStyle = blink ? '#ccffff' : '#44aaaa';
          ctx.fillRect(px + 9, py + 9, 3, 3);
        });
      }

      // FOOD (retro apple)
      const fx = food.x * CELL + CELL / 2;
      const fy = food.y * CELL + CELL / 2;
      ctx.fillStyle = '#ff3333';
      ctx.beginPath();
      ctx.arc(fx, fy, CELL / 2 - 2, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#22aa22';
      ctx.fillRect(fx + 3, fy - 7, 5, 4);
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(fx - 4, fy - 4, 3, 3);

      // SNAKE
      snake.forEach((seg, index) => {
        const x = seg.x * CELL;
        const y = seg.y * CELL;
        const isHead = index === 0;

        if (isHead) {
          ctx.fillStyle = '#66ff66';
          ctx.fillRect(x + 1, y + 1, CELL - 2, CELL - 2);
          ctx.fillStyle = '#000000';
          const eyeSize = 3;
          const eyeOffset = 5;
          if (dir.x === 1) {
            ctx.fillRect(x + CELL - eyeOffset, y + 5, eyeSize, eyeSize);
            ctx.fillRect(x + CELL - eyeOffset, y + CELL - 8, eyeSize, eyeSize);
          } else if (dir.x === -1) {
            ctx.fillRect(x + 3, y + 5, eyeSize, eyeSize);
            ctx.fillRect(x + 3, y + CELL - 8, eyeSize, eyeSize);
          } else if (dir.y === -1) {
            ctx.fillRect(x + 5, y + 3, eyeSize, eyeSize);
            ctx.fillRect(x + CELL - 8, y + 3, eyeSize, eyeSize);
          } else {
            ctx.fillRect(x + 5, y + CELL - eyeOffset, eyeSize, eyeSize);
            ctx.fillRect(x + CELL - 8, y + CELL - eyeOffset, eyeSize, eyeSize);
          }
        } else {
          ctx.fillStyle = index % 2 === 0 ? '#22cc22' : '#1aa61a';
          ctx.fillRect(x + 1, y + 1, CELL - 2, CELL - 2);
          ctx.strokeStyle = '#003300';
          ctx.lineWidth = 1;
          ctx.strokeRect(x + 2, y + 2, CELL - 4, CELL - 4);
        }
      });

      // OVERLAYS
      if (paused) {
        ctx.fillStyle = 'rgba(0, 0, 0, 0.78)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#66ff66';
        ctx.font = 'bold 30px "Courier New", monospace';
        ctx.textAlign = 'center';
        ctx.fillText('PAUSED', canvas.width / 2, canvas.height / 2 - 8);
        ctx.font = '13px "Courier New", monospace';
        ctx.fillText('PRESS SPACE OR P TO RESUME', canvas.width / 2, canvas.height / 2 + 20);
      }

      if (gameOver) {
        ctx.fillStyle = 'rgba(0, 0, 0, 0.82)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#ff5555';
        ctx.font = 'bold 26px "Courier New", monospace';
        ctx.textAlign = 'center';
        ctx.fillText('GAME OVER', canvas.width / 2, canvas.height / 2 - 18);
        ctx.fillStyle = '#66ff66';
        ctx.font = 'bold 16px "Courier New", monospace';
        ctx.fillText('SCORE: ' + String(score).padStart(3, '0'), canvas.width / 2, canvas.height / 2 + 10);
        ctx.font = '12px "Courier New", monospace';
        ctx.fillText('PRESS [R] TO RESTART', canvas.width / 2, canvas.height / 2 + 34);
      }

      if (!gameStarted && !paused && !gameOver) {
        ctx.fillStyle = 'rgba(0, 0, 0, 0.65)';
        ctx.fillRect(18, canvas.height / 2 - 28, canvas.width - 36, 56);
        ctx.fillStyle = '#aaffaa';
        ctx.font = '13px "Courier New", monospace';
        ctx.textAlign = 'center';
        ctx.fillText('PRESS ARROW KEYS OR WASD TO START', canvas.width / 2, canvas.height / 2 + 4);
      }
    }

    // ===== END =====
    function endGame() {
      gameOver = true;
      playBeep(110, 0.42, 'sawtooth', 0.11);
      draw();
    }

    // ===== GAME LOOP =====
    function gameLoop(timestamp = 0) {
      if (!timestamp) timestamp = performance.now();
      const now = timestamp;

      if (!paused && !gameOver && gameStarted) {
        if (now - lastMoveTime >= moveInterval) {
          update();
          lastMoveTime = now;
        }
        if (now >= warpNextTime) {
          relocateWarp();
        }
      }

      updateWarpUI();
      draw();
      requestAnimationFrame(gameLoop);
    }

    // ===== KEYBOARD (ONLY) =====
    function handleKey(e) {
      if (gameOver && (e.key === 'r' || e.key === 'R')) {
        resetGame();
        return;
      }

      let newDir = null;
      switch (e.key) {
        case 'ArrowUp': case 'w': case 'W': newDir = { x: 0, y: -1 }; break;
        case 'ArrowDown': case 's': case 'S': newDir = { x: 0, y: 1 }; break;
        case 'ArrowLeft': case 'a': case 'A': newDir = { x: -1, y: 0 }; break;
        case 'ArrowRight': case 'd': case 'D': newDir = { x: 1, y: 0 }; break;
        case ' ': case 'p': case 'P':
          e.preventDefault();
          togglePause();
          return;
        case 'r': case 'R':
          resetGame();
          return;
      }
      if (newDir) {
        e.preventDefault();
        changeDirection(newDir);
      }
    }

    // ===== PAUSE =====
    function togglePause() {
      if (gameOver) return;
      const now = performance.now();
      if (!paused) {
        pausedWarpRemaining = Math.max(1200, warpNextTime - now);
      } else {
        warpNextTime = now + pausedWarpRemaining;
      }
      paused = !paused;
      if (!paused && gameStarted) {
        lastMoveTime = now;
      }
      updateWarpUI();
      draw();
    }

    // ===== TOUCH CONTROLS (swipe + tap, no on-screen D-Pad) =====
    function handleTouchStart(e) {
      e.preventDefault();
      if (e.touches.length !== 1) return;
      const rect = canvas.getBoundingClientRect();
      touchStartX = e.touches[0].clientX - rect.left;
      touchStartY = e.touches[0].clientY - rect.top;
      touchStartTime = performance.now();
      touchMoved = false;
    }

    function handleTouchMove(e) {
      e.preventDefault();
      if (e.touches.length !== 1) return;
      const rect = canvas.getBoundingClientRect();
      const curX = e.touches[0].clientX - rect.left;
      const curY = e.touches[0].clientY - rect.top;
      const dx = curX - touchStartX;
      const dy = curY - touchStartY;
      const dist = Math.hypot(dx, dy);
      if (dist > SWIPE_THRESHOLD && !touchMoved) {
        touchMoved = true;
        processSwipe(dx, dy);
      }
    }

    function handleTouchEnd(e) {
      e.preventDefault();
      if (touchMoved) {
        touchMoved = false;
        return;
      }
      const now = performance.now();
      const dt = now - touchStartTime;
      let endX = touchStartX;
      let endY = touchStartY;
      if (e.changedTouches && e.changedTouches.length > 0) {
        const rect = canvas.getBoundingClientRect();
        endX = e.changedTouches[0].clientX - rect.left;
        endY = e.changedTouches[0].clientY - rect.top;
      }
      const dx = endX - touchStartX;
      const dy = endY - touchStartY;
      const dist = Math.hypot(dx, dy);
      if (dist > SWIPE_THRESHOLD) {
        processSwipe(dx, dy);
      } else if (dist < 32 && dt < 450) {
        handleTap(touchStartX, touchStartY);
      }
    }

    function processSwipe(dx, dy) {
      if (gameOver) {
        resetGame();
        return;
      }
      let newDir = null;
      const absDx = Math.abs(dx);
      const absDy = Math.abs(dy);
      if (absDx > absDy) {
        newDir = dx > 0 ? { x: 1, y: 0 } : { x: -1, y: 0 };
      } else {
        newDir = dy > 0 ? { x: 0, y: 1 } : (dy < 0 ? { x: 0, y: -1 } : null);
      }
      if (newDir) changeDirection(newDir);
    }

    function handleTap(tapX, tapY) {
      if (gameOver) {
        resetGame();
        return;
      }
      if (!gameStarted) {
        // first tap starts the game (uses current initial dir); prefer swipe to choose dir
        gameStarted = true;
        lastMoveTime = performance.now();
        warpNextTime = performance.now() + 10000;
        draw();
        return;
      }

      const head = snake[0];
      const hx = head.x * CELL + CELL / 2;
      const hy = head.y * CELL + CELL / 2;
      const dx = tapX - hx;
      const dy = tapY - hy;
      const dist = Math.hypot(dx, dy);

      const isReverse = (d) => d.x === -dir.x && d.y === -dir.y;

      if (dist < 20) {
        // tap near head -> relative left turn (counter-clockwise)
        let newDir;
        if (dir.x === 1) newDir = { x: 0, y: -1 };
        else if (dir.x === -1) newDir = { x: 0, y: 1 };
        else if (dir.y === -1) newDir = { x: -1, y: 0 };
        else newDir = { x: 1, y: 0 };
        if (!isReverse(newDir)) changeDirection(newDir);
        return;
      }

      // choose best non-reverse direction by dot-product (tap position relative to head)
      const cands = [
        { x: 0, y: -1 },
        { x: 0, y: 1 },
        { x: -1, y: 0 },
        { x: 1, y: 0 }
      ].filter(d => !isReverse(d));

      let best = cands[0];
      let bestScore = -Infinity;
      for (const c of cands) {
        const dot = c.x * dx + c.y * dy;
        if (dot > bestScore) {
          bestScore = dot;
          best = c;
        }
      }
      changeDirection(best);
    }

    function initTouchControls() {
      canvas.addEventListener('touchstart', handleTouchStart, { passive: false });
      canvas.addEventListener('touchmove', handleTouchMove, { passive: false });
      canvas.addEventListener('touchend', handleTouchEnd, { passive: false });
      canvas.addEventListener('touchcancel', (e) => { e.preventDefault(); touchMoved = false; }, { passive: false });
    }

    // ===== INIT =====
    function init() {
      document.addEventListener('keydown', handleKey);
      initTouchControls();
      resetGame();
      requestAnimationFrame(gameLoop);
      console.log('%c[Snake Retro] Keyboard + Touch (swipe/tap) + Walls + Warp Gates ready.', 'color:#114411');
    }

    window.onload = init;
  </script>
</body>
