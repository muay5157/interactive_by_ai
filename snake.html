<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>เกมงู | SNAKE</title>
  <style>
    /* ===== RETRO STYLE (Nokia-like green phosphor) ===== */
    :root {
      --bg: #000000;
      --green: #33ff33;
      --dark-green: #0a1a0a;
      --border: #114411;
      --accent: #00cc00;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 12px 8px;
      background: #0a0a0a;
      color: var(--green);
      font-family: 'Courier New', 'Lucida Console', monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      touch-action: manipulation;
    }
    .header {
      text-align: center;
      margin-bottom: 8px;
    }
    .title {
      font-size: 28px;
      letter-spacing: 4px;
      text-shadow: 0 0 8px var(--green);
      margin: 0;
      font-weight: bold;
    }
    .subtitle {
      font-size: 11px;
      opacity: 0.7;
      letter-spacing: 2px;
      margin-top: 2px;
    }
    .status-bar {
      display: flex;
      justify-content: space-between;
      width: min(400px, 92vmin);
      background: #001100;
      border: 4px solid var(--border);
      padding: 6px 14px;
      margin-bottom: 4px;
      font-size: 15px;
      font-weight: bold;
      text-shadow: 0 0 4px var(--green);
    }
    .status-item {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .label { opacity: 0.75; font-size: 12px; }
    .value { color: #66ff66; min-width: 36px; text-align: right; }

    .game-wrapper {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    canvas {
      width: min(400px, 92vmin);
      height: min(400px, 92vmin);
      image-rendering: pixelated;
      border: 8px solid #114411;
      background: #000;
      box-shadow: 0 0 0 4px #001100,
                  0 8px 0 #001100;
      touch-action: none;
      cursor: crosshair;
    }

    /* Retro buttons */
    .btn-row {
      display: flex;
      gap: 12px;
      margin: 12px 0 8px;
      width: min(400px, 92vmin);
      justify-content: center;
    }
    button {
      font-family: 'Courier New', monospace;
      font-size: 14px;
      font-weight: bold;
      letter-spacing: 1px;
      padding: 10px 20px;
      background: #001100;
      color: var(--green);
      border: 3px solid var(--border);
      cursor: pointer;
      min-width: 110px;
      transition: all 0.05s ease;
      user-select: none;
      text-shadow: 0 0 3px var(--green);
    }
    button:active {
      background: #003300;
      border-color: var(--accent);
      transform: translateY(1px);
      box-shadow: inset 0 2px 4px rgba(0,0,0,0.5);
    }
    button:disabled {
      opacity: 0.5;
      cursor: default;
    }


    .instructions {
      margin-top: 10px;
      font-size: 10px;
      opacity: 0.6;
      text-align: center;
      line-height: 1.4;
    }
    .instructions kbd {
      background: #001100;
      border: 1px solid #114411;
      padding: 1px 4px;
      font-size: 9px;
    }

    /* Game over / pause overlay text is drawn on canvas */
    @media (max-width: 380px) {
      .title { font-size: 22px; }
      button { font-size: 13px; padding: 8px 14px; min-width: 90px; }
    }
  </style>
</head>
<body>
  <div class="header">
    <h1 class="title">SNAKE</h1>
    <div class="subtitle">เกมงูคลาสสิก • RETRO 1980s</div>
  </div>

  <!-- Score & Speed -->
  <div class="status-bar">
    <div class="status-item">
      <span class="label">SCORE</span>
      <span id="score" class="value">000</span>
    </div>
    <div class="status-item">
      <span class="label">SPEED</span>
      <span id="level" class="value">01</span>
    </div>
  </div>

  <div class="game-wrapper">
    <!-- Game Canvas (20x20 grid) -->
    <canvas id="game" width="400" height="400" aria-label="Snake game board"></canvas>

    <!-- Pause & Restart -->
    <div class="btn-row">
      <button id="pauseBtn">PAUSE</button>
      <button id="restartBtn">RESTART</button>
    </div>

    <!-- Mobile D-Pad -->
    <div class="dpad" id="dpad">
      <button class="empty" aria-hidden="true"></button>
      <button id="upBtn" aria-label="Up">▲</button>
      <button class="empty" aria-hidden="true"></button>

      <button id="leftBtn" aria-label="Left">◀</button>
      <button class="empty" aria-hidden="true"></button>
      <button id="rightBtn" aria-label="Right">▶</button>

      <button class="empty" aria-hidden="true"></button>
      <button id="downBtn" aria-label="Down">▼</button>
      <button class="empty" aria-hidden="true"></button>
    </div>
  </div>

  <div class="instructions">
    KEYBOARD: <kbd>↑</kbd><kbd>↓</kbd><kbd>←</kbd><kbd>→</kbd> หรือ WASD &nbsp;|&nbsp; 
    MOBILE: แตะปุ่มลูกศรหรือปัดบนหน้าจอ
  </div>

  <script>
    // ===== CONFIG =====
    const GRID = 20;           // ขนาดตาราง 20x20 ช่อง (คลาสสิก)
    const CELL = 20;           // ขนาด 1 ช่อง = 20px → 400x400
    const INITIAL_SPEED = 160; // มิลลิวินาทีต่อการเคลื่อนที่ (เริ่มต้นช้า)
    const MIN_SPEED = 55;      // ความเร็วสูงสุด (เร็วที่สุด)

    // ===== STATE =====
    let snake = [];            // อาเรย์ของ {x, y} ศีรษะอยู่ที่ [0]
    let dir = { x: 1, y: 0 };  // ทิศทางปัจจุบัน
    let pendingDir = { x: 1, y: 0 }; // ทิศทางรอ (กันหันหลังทันที)
    let food = { x: 0, y: 0 };
    let score = 0;
    let level = 1;
    let foodsEaten = 0;
    let moveInterval = INITIAL_SPEED;
    let lastMoveTime = 0;
    let paused = false;
    let gameOver = false;
    let gameStarted = false;

    // Canvas
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d', { alpha: false });

    // UI elements
    const scoreEl = document.getElementById('score');
    const levelEl = document.getElementById('level');
    const pauseBtn = document.getElementById('pauseBtn');
    const restartBtn = document.getElementById('restartBtn');

    // ===== AUDIO (beep แบบ retro) =====
    let audioCtx;
    function playBeep(freq, duration, type = 'square', vol = 0.08) {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        const filter = audioCtx.createBiquadFilter();
        osc.type = type;
        osc.frequency.value = freq;
        filter.type = 'lowpass';
        filter.frequency.value = 1200;
        gain.gain.value = vol;
        const now = audioCtx.currentTime;
        osc.connect(filter);
        filter.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        // หยุดเสียง + fade
        gain.gain.linearRampToValueAtTime(0.0001, now + duration);
        osc.stop(now + duration + 0.05);
      } catch (e) { /* silent */ }
    }

    // ===== INITIALIZE / RESET =====
    function resetGame() {
      // เริ่มงู 3 ช่องตรงกลางซ้าย เคลื่อนขวา
      snake = [
        { x: 6, y: 10 },
        { x: 5, y: 10 },
        { x: 4, y: 10 }
      ];
      dir = { x: 1, y: 0 };
      pendingDir = { x: 1, y: 0 };
      score = 0;
      level = 1;
      foodsEaten = 0;
      moveInterval = INITIAL_SPEED;
      paused = false;
      gameOver = false;
      gameStarted = false;
      lastMoveTime = 0;

      spawnFood();
      updateUI();
      pauseBtn.textContent = 'PAUSE';
      pauseBtn.disabled = false;
      draw(); // วาดเฟรมแรก
    }

    // ===== SPAWN FOOD (สุ่มตำแหน่งไม่ทับงู) =====
    function spawnFood() {
      let newFood;
      do {
        newFood = {
          x: Math.floor(Math.random() * GRID),
          y: Math.floor(Math.random() * GRID)
        };
      } while (snake.some(seg => seg.x === newFood.x && seg.y === newFood.y));
      food = newFood;
    }

    // ===== UPDATE SCORE & LEVEL =====
    function updateUI() {
      scoreEl.textContent = String(score).padStart(3, '0');
      levelEl.textContent = String(level).padStart(2, '0');
    }

    // ===== SPEED UP (กินอาหาร 4 ครั้ง = +1 ระดับ) =====
    function increaseSpeed() {
      level = Math.min(12, 1 + Math.floor(foodsEaten / 4));
      // ยิ่งเลเวลสูง ยิ่งเร็ว (ลด interval)
      moveInterval = Math.max(MIN_SPEED, Math.floor(INITIAL_SPEED - (level - 1) * 9));
    }

    // ===== CHANGE DIRECTION (กันหัน 180 องศา) =====
    function changeDirection(newDir) {
      if (gameOver) return;

      // เริ่มเกมเมื่อกดปุ่มครั้งแรก
      if (!gameStarted) {
        gameStarted = true;
        lastMoveTime = performance.now();
      }

      // กันหันหลังชนตัวเองทันที
      if (newDir.x === -dir.x && newDir.y === -dir.y) return;

      pendingDir = newDir;
    }

    // ===== UPDATE GAME LOGIC (เรียกเมื่อถึงเวลา move) =====
    function update() {
      if (paused || gameOver || !gameStarted) return;

      // ใช้ทิศทางที่รอไว้
      dir = pendingDir;

      // คำนวณตำแหน่งหัวใหม่
      const head = {
        x: snake[0].x + dir.x,
        y: snake[0].y + dir.y
      };

      // 1. ทะลุขอบ (wrap around) - ไม่มีกำแพง
      head.x = (head.x + GRID) % GRID;
      head.y = (head.y + GRID) % GRID;

      // 2. ชนตัวเอง (ยกเว้นหาง เพราะหางจะขยับออกในเฟรมนี้ ถ้าไม่กินอาหาร)
      const tailIndex = snake.length - 1;
      const collides = snake.some((seg, idx) => idx !== tailIndex && seg.x === head.x && seg.y === head.y);
      if (collides) {
        endGame();
        return;
      }

      // เพิ่มหัว
      snake.unshift(head);

      // 3. กินอาหาร?
      let ate = false;
      if (head.x === food.x && head.y === food.y) {
        score += 10;
        foodsEaten++;
        increaseSpeed();
        playBeep(880, 0.09, 'square', 0.1); // เสียงกินแอปเปิ้ล
        spawnFood();
        ate = true;
        updateUI();
      }

      // ถ้าไม่กิน → ตัดหาง (ความยาวคงที่)
      if (!ate) {
        snake.pop();
      }
    }

    // ===== DRAW EVERYTHING =====
    function draw() {
      // พื้นหลังดำสนิท (retro CRT)
      ctx.fillStyle = '#000000';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // วาดเส้นตารางแบบจอเก่า (subtle)
      ctx.strokeStyle = '#0a220a';
      ctx.lineWidth = 1;
      for (let i = 0; i <= GRID; i++) {
        // แนวตั้ง
        ctx.beginPath();
        ctx.moveTo(i * CELL, 0);
        ctx.lineTo(i * CELL, canvas.height);
        ctx.stroke();
        // แนวนอน
        ctx.beginPath();
        ctx.moveTo(0, i * CELL);
        ctx.lineTo(canvas.width, i * CELL);
        ctx.stroke();
      }

      // วาดอาหาร (แอปเปิ้ล retro)
      const fx = food.x * CELL + CELL / 2;
      const fy = food.y * CELL + CELL / 2;
      // ตัวแอปเปิ้ล
      ctx.fillStyle = '#ff3333';
      ctx.beginPath();
      ctx.arc(fx, fy, CELL / 2 - 2, 0, Math.PI * 2);
      ctx.fill();
      // ใบไม้เขียวเล็ก ๆ
      ctx.fillStyle = '#22aa22';
      ctx.fillRect(fx + 3, fy - 7, 5, 4);
      // จุดไฮไลต์
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(fx - 4, fy - 4, 3, 3);

      // วาดงู
      snake.forEach((seg, index) => {
        const x = seg.x * CELL;
        const y = seg.y * CELL;
        const isHead = index === 0;

        if (isHead) {
          // หัวงู (เขียวสด + ตา)
          ctx.fillStyle = '#66ff66';
          ctx.fillRect(x + 1, y + 1, CELL - 2, CELL - 2);
          // ตา 2 ข้าง (ตามทิศทาง)
          ctx.fillStyle = '#000000';
          const eyeSize = 3;
          const eyeOffset = 5;
          if (dir.x === 1) { // ขวา
            ctx.fillRect(x + CELL - eyeOffset, y + 5, eyeSize, eyeSize);
            ctx.fillRect(x + CELL - eyeOffset, y + CELL - 8, eyeSize, eyeSize);
          } else if (dir.x === -1) { // ซ้าย
            ctx.fillRect(x + 3, y + 5, eyeSize, eyeSize);
            ctx.fillRect(x + 3, y + CELL - 8, eyeSize, eyeSize);
          } else if (dir.y === -1) { // บน
            ctx.fillRect(x + 5, y + 3, eyeSize, eyeSize);
            ctx.fillRect(x + CELL - 8, y + 3, eyeSize, eyeSize);
          } else { // ล่าง
            ctx.fillRect(x + 5, y + CELL - eyeOffset, eyeSize, eyeSize);
            ctx.fillRect(x + CELL - 8, y + CELL - eyeOffset, eyeSize, eyeSize);
          }
        } else {
          // ลำตัว (เขียวเข้มกว่า + ขอบ)
          ctx.fillStyle = index % 2 === 0 ? '#22cc22' : '#1aa61a';
          ctx.fillRect(x + 1, y + 1, CELL - 2, CELL - 2);
          // ขอบ pixel เพื่อความ retro
          ctx.strokeStyle = '#003300';
          ctx.lineWidth = 1;
          ctx.strokeRect(x + 2, y + 2, CELL - 4, CELL - 4);
        }
      });

      // ===== OVERLAY: PAUSED / GAME OVER =====
      if (paused) {
        ctx.fillStyle = 'rgba(0, 0, 0, 0.75)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#66ff66';
        ctx.font = 'bold 32px "Courier New", monospace';
        ctx.textAlign = 'center';
        ctx.fillText('PAUSED', canvas.width / 2, canvas.height / 2 - 10);
        ctx.font = '14px "Courier New", monospace';
        ctx.fillText('PRESS PAUSE TO RESUME', canvas.width / 2, canvas.height / 2 + 22);
      }

      if (gameOver) {
        ctx.fillStyle = 'rgba(0, 0, 0, 0.8)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#ff5555';
        ctx.font = 'bold 28px "Courier New", monospace';
        ctx.textAlign = 'center';
        ctx.fillText('GAME OVER', canvas.width / 2, canvas.height / 2 - 20);
        ctx.fillStyle = '#66ff66';
        ctx.font = 'bold 18px "Courier New", monospace';
        ctx.fillText('SCORE: ' + String(score).padStart(3, '0'), canvas.width / 2, canvas.height / 2 + 12);
        ctx.font = '12px "Courier New", monospace';
        ctx.fillText('PRESS RESTART', canvas.width / 2, canvas.height / 2 + 36);
      }

      // เริ่มต้นครั้งแรก แสดงข้อความแนะนำ
      if (!gameStarted && !paused && !gameOver) {
        ctx.fillStyle = 'rgba(0, 0, 0, 0.6)';
        ctx.fillRect(20, canvas.height / 2 - 30, canvas.width - 40, 60);
        ctx.fillStyle = '#aaffaa';
        ctx.font = '13px "Courier New", monospace';
        ctx.textAlign = 'center';
        ctx.fillText('PRESS ARROW / TAP D-PAD TO START', canvas.width / 2, canvas.height / 2 + 5);
      }
    }

    // ===== END GAME =====
    function endGame() {
      gameOver = true;
      playBeep(120, 0.45, 'sawtooth', 0.12); // เสียงตาย
      pauseBtn.disabled = true;
      draw();
    }

    // ===== GAME LOOP (ใช้ rAF + timer) =====
    function gameLoop(timestamp = 0) {
      if (!timestamp) timestamp = performance.now();

      // เคลื่อนที่เมื่อถึงเวลา (แยกจาก render)
      if (!paused && !gameOver && gameStarted) {
        if (timestamp - lastMoveTime >= moveInterval) {
          update();
          lastMoveTime = timestamp;
        }
      }

      draw();
      requestAnimationFrame(gameLoop);
    }

    // ===== INPUT: KEYBOARD =====
    function handleKey(e) {
      if (gameOver && (e.key === 'r' || e.key === 'R')) {
        resetGame();
        return;
      }

      let newDir = null;
      switch (e.key) {
        case 'ArrowUp':
        case 'w':
        case 'W':
          newDir = { x: 0, y: -1 };
          break;
        case 'ArrowDown':
        case 's':
        case 'S':
          newDir = { x: 0, y: 1 };
          break;
        case 'ArrowLeft':
        case 'a':
        case 'A':
          newDir = { x: -1, y: 0 };
          break;
        case 'ArrowRight':
        case 'd':
        case 'D':
          newDir = { x: 1, y: 0 };
          break;
        case ' ':
        case 'p':
        case 'P':
          e.preventDefault();
          togglePause();
          return;
        case 'r':
        case 'R':
          resetGame();
          return;
      }
      if (newDir) {
        e.preventDefault();
        changeDirection(newDir);
      }
    }

    // ===== INPUT: D-PAD BUTTONS =====
    function setupDpad() {
      const dirs = {
        upBtn: { x: 0, y: -1 },
        downBtn: { x: 0, y: 1 },
        leftBtn: { x: -1, y: 0 },
        rightBtn: { x: 1, y: 0 }
      };

      Object.keys(dirs).forEach(id => {
        const btn = document.getElementById(id);
        if (!btn) return;

        const handler = (ev) => {
          ev.preventDefault();
          changeDirection(dirs[id]);
        };
        btn.addEventListener('click', handler);
        btn.addEventListener('touchstart', handler, { passive: false });
      });
    }

    // ===== SWIPE ON CANVAS (ดีสำหรับมือถือ) =====
    function setupSwipe() {
      let startX = 0, startY = 0;
      const THRESHOLD = 25; // ระยะขั้นต่ำที่จะถือว่าเป็นการปัด

      canvas.addEventListener('touchstart', (e) => {
        if (gameOver) return;
        const t = e.touches[0];
        startX = t.clientX;
        startY = t.clientY;
      }, { passive: true });

      canvas.addEventListener('touchend', (e) => {
        if (gameOver || !e.changedTouches.length) return;
        const t = e.changedTouches[0];
        const dx = t.clientX - startX;
        const dy = t.clientY - startY;

        if (Math.abs(dx) < THRESHOLD && Math.abs(dy) < THRESHOLD) return;

        let newDir = null;
        if (Math.abs(dx) > Math.abs(dy)) {
          // แนวนอน
          newDir = dx > 0 ? { x: 1, y: 0 } : { x: -1, y: 0 };
        } else {
          // แนวตั้ง
          newDir = dy > 0 ? { x: 0, y: 1 } : { x: 0, y: -1 };
        }
        if (newDir) {
          e.preventDefault();
          changeDirection(newDir);
        }
      }, { passive: false });
    }

    // ===== TAP CONTROL (กดหน้าจอเพื่อเลี้ยว - ไม่ต้องใช้ปุ่มลูกศร) =====
    function setupTapControl() {
      canvas.addEventListener('click', (e) => {
        if (gameOver || !gameStarted) return;
        
        const rect = canvas.getBoundingClientRect();
        const clickX = e.clientX - rect.left;
        const clickY = e.clientY - rect.top;
        
        const centerX = canvas.width / 2;
        const centerY = canvas.height / 2;
        
        const dx = clickX - centerX;
        const dy = clickY - centerY;
        
        let newDir = null;
        
        if (Math.abs(dx) > Math.abs(dy)) {
          // แนวนอน
          newDir = dx > 0 ? { x: 1, y: 0 } : { x: -1, y: 0 };
        } else {
          // แนวตั้ง
          newDir = dy > 0 ? { x: 0, y: 1 } : { x: 0, y: -1 };
        }
        
        if (!gameStarted) {
          gameStarted = true;
          lastMoveTime = performance.now();
        }
        if (newDir) {
          changeDirection(newDir);
        }
      });
    }

    // ===== PAUSE / RESUME =====
    function togglePause() {
      if (gameOver) return;
      paused = !paused;
      pauseBtn.textContent = paused ? 'RESUME' : 'PAUSE';
      if (!paused && gameStarted) {
        lastMoveTime = performance.now(); // รีเซ็ตเวลาเพื่อไม่ให้ขยับทันที
      }
      draw();
    }

    // ===== BUTTONS =====
    function setupButtons() {
      pauseBtn.addEventListener('click', togglePause);
      pauseBtn.addEventListener('touchstart', (e) => { e.preventDefault(); togglePause(); }, { passive: false });

      restartBtn.addEventListener('click', () => {
        resetGame();
        // เริ่มวิ่งทันทีเมื่อกด restart
        if (!gameStarted) {
          gameStarted = true;
          lastMoveTime = performance.now();
        }
      });
      restartBtn.addEventListener('touchstart', (e) => {
        e.preventDefault();
        resetGame();
        gameStarted = true;
        lastMoveTime = performance.now();
      }, { passive: false });
    }

    // ===== INIT =====
    function init() {
      // ตั้งค่าปุ่มและ input
      setupDpad();
      setupSwipe();
      setupTapControl();
      setupButtons();
      document.addEventListener('keydown', handleKey);

      // เริ่มเกม
      resetGame();

      // เริ่ม loop การวาดและอัพเดท
      requestAnimationFrame(gameLoop);

      // คำแนะนำเล็กน้อยใน console (สำหรับ dev)
